name: Database Validation & Distribution Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/database-pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Validate Schema & Build Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Run Schema & Referential Validation
        run: |
          python scripts/build_database.py

      - name: Commit & Push Distribution Updates (on Main Branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes in distribution artifacts to commit."
          else
            git commit -m "chore(dist): auto-compile distribution files and index [skip ci]"
            git push origin main
          fi
